services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat_app
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./app
    environment:
      DATABASE_URL: postgresql+psycopg2://chat_user:chat_password@postgres:5432/chat_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./app:/app

volumes:
  postgres_data:
